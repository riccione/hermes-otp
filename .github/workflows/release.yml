---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@6d2d2b11d2d5c84128517a7b2085a00005d20891
    permissions:
      contents: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
