---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@daa83cb1cf66db9ddd49f79b95d5b0a0785297e0
    permissions:
      contents: write
      id-token: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
