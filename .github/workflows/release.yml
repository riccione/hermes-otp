---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@3487d1cb4ee8c0edcc41d810caa3d8d07f67d43d
    permissions:
      contents: write
      id-token: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
