---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@de12501251efdb915e3f442fbef7dae403172440
    permissions:
      contents: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
