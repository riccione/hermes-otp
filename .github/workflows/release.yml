---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@ce76b0cedf27f44d1ba08e7bde07e0576e75287e
    permissions:
      contents: write
    with:
      bin_name: hermes-otp
      tag: ${{ github.ref_name }}
