---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@2dc80fece2101332621adb1b38cf9a35cf158231
    permissions:
      contents: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
