---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@da44dcc116339d829f340d62586fc32c73a410cf
    permissions:
      contents: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
