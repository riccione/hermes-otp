[package]
name = "hermes-otp"
version = "0.7.1"
edition = "2024"
license = "MIT"
description = "Hermes-OTP: CLI OTP manager app"
homepage = "https://github.com/riccione/hermes-otp"
documentation = "https://github.com/riccione/hermes-otp"
repository = "https://github.com/riccione/hermes-otp"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.metadata.release]
# We tag manually from `main` after the release PR is merged,
# so cargo-release must never create the tag itself.
tag = false

# Format to use if/when a tag is created (kept here for reference/consistency,
# even though `tag = false` means cargo-release itself won't create it).
tag-name = "v{{version}}"

# We push manually (release branch, then tag from main after merge),
# so cargo-release must never push.
push = false

# Private app, not published to crates.io.
publish = false

# Regenerate CHANGELOG.md with git-cliff before the release commit,
# so the changelog update ships in the same commit as the version bump.
pre-release-hook = ["git", "cliff", "-o", "CHANGELOG.md", "--tag", "v{{version}}"]

# Only allow running `cargo release` from a release prep branch
# (e.g. release/v1.2.3), never directly on the protected `main` branch.
allow-branch = ["release/v*"]

[profile.release]
strip = true
lto = true
#panic = "abort"
opt-level = "z"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.11"
dirs = "7.0"
magic-crypt = "5.0"
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
totp-lite = "2.0"
console = "0.16"
url = "2.5"
urlencoding = "2.1"
nucleo-matcher = "0.3"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
serde_json = "1.0"
tempfile = "3.27"
