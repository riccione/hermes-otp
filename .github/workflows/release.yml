---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@b27a8bfb3daae371bbd204a6d6555b7f062314f0
    permissions:
      contents: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
