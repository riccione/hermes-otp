---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@5dc873077d9ec45384ad9b41751c44dc555bcd0b
    permissions:
      contents: write
      id-token: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
