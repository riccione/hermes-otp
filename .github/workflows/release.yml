---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@a42157e21f91d87ff97e4a6a30f431f687052064
    permissions:
      contents: write
    with:
      bin_name: hermes-otp
      tag: ${{ github.ref_name }}
