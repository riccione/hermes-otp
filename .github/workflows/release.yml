---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@7ed8a722bf3860061e17c1b84d0e1cf3a5a2fb5d
    permissions:
      contents: write
      id-token: write
    with:
      bin_names: "hermes-otp"
      build_musl: true
      tag: ${{ github.ref_name }}
