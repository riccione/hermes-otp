---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@1249a989e5d9fbe23e35d554236fadd95f896176
    permissions:
      contents: write
      id-token: write
    with:
      bin_names: "hermes-otp"
      tag: ${{ github.ref_name }}
